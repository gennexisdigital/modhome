<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Manrope:wght@400;500;600&display=swap">
<style>
:root{--bg:#FFFFFF;--bg2:#FAF7F1;--line:#E7E0D3;--line2:#D3C8B3;--ink:#15130F;--ink2:#3F3830;--mute:#6F665A;--accent:#B8933F;--accent2:#8F6F25;--gold-light:#E2C77E}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg2);color:var(--ink);font-family:"Manrope",system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-top:2px solid var(--accent);padding:48px 40px 40px;box-shadow:0 40px 70px -50px rgba(60,45,15,.35);text-align:center}
.card img{height:26px;width:auto;margin:0 auto 28px;display:block}
.eyebrow{font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent2);font-weight:600;margin:0 0 12px}
h1{font-family:"Fraunces",Georgia,serif;font-weight:500;font-size:30px;line-height:1.15;margin:0 0 10px;letter-spacing:-.005em}
h1 em{font-style:italic;font-weight:400}
p{color:var(--ink2);margin:0 0 28px;font-size:15px}
form{display:flex;flex-direction:column;gap:14px;text-align:left}
label{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-weight:500}
.row{display:flex;gap:10px;align-items:stretch}
input{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px solid var(--line2);font:inherit;font-size:17px;padding:10px 0;color:var(--ink);border-radius:0;letter-spacing:.08em}
input:focus{outline:0;border-bottom-color:var(--accent)}
button{font:inherit;cursor:pointer;background:var(--ink);color:#fff;border:1px solid var(--ink);padding:14px 22px;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;transition:background .25s}
button:hover{background:var(--accent2);border-color:var(--accent2)}
button[disabled]{opacity:.6;cursor:wait}
.err{color:#B4542F;font-size:13px;min-height:20px;margin:0}
.foot{margin-top:26px;font-size:12px;letter-spacing:.06em;color:var(--mute)}
.foot a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line2)}
.hair{height:1px;background:linear-gradient(90deg,transparent,var(--gold-light) 30%,var(--accent) 50%,var(--gold-light) 70%,transparent);margin:0 -40px 28px}
</style>
</head>

const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(SALT),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(IV)},key,u(CT));
  const html=new TextDecoder().decode(buf);
  document.open(); document.write(html); document.close();
}
const f=document.getElementById("f"), pw=document.getElementById("pw"), err=document.getElementById("err"), go=document.getElementById("go");
f.addEventListener("submit",async e=>{
  e.preventDefault(); err.textContent=""; go.disabled=true; go.textContent="…";
  try{ const v=pw.value; await unlock(v); try{localStorage.setItem("modhome-key",v);}catch(_){} }
  catch(_){ err.textContent="Incorrect password. 密码不正确。"; go.disabled=false; go.textContent="Enter"; pw.select(); }
});
(async()=>{ try{ const v=localStorage.getItem("modhome-key"); if(v){ await unlock(v); } }catch(_){ try{localStorage.removeItem("modhome-key");}catch(__){} } })();
</script>
